<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programmed Love - Corazon Real</title>
<style>
  body {
    margin: 0;
    background-color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    perspective: 1000px;
  }
  .container {
    position: relative;
    transform-style: preserve-3d;
    animation: rotate 20s infinite linear;
  }
  @keyframes rotate {
    from { transform: rotateY(0deg) rotateX(10deg); }
    to { transform: rotateY(360deg) rotateX(10deg); }
  }
  .love_word {
    color: #0000FF;
    font-size: 1.5rem;
    font-family: Arial, sans-serif;
    position: absolute;
    text-shadow: 0 0 10px #00ffff;
    white-space: nowrap;
    opacity: 0;
    animation: heart-anima 4s infinite linear;
  }
  @keyframes heart-anima {
    0% { opacity: 0; transform: translate3d(var(--x), var(--y), var(--z)) scale(0.5); }
    50% { opacity: 1; transform: translate3d(var(--x), var(--y), var(--z)) scale(1.2); }
    100% { opacity: 0; transform: translate3d(var(--x), var(--y), var(--z)) scale(0.5); }
  }
</style>
</head>
<body>
<div class="container" id="heart-container"></div>

<script>
  const container = document.getElementById('heart-container');
  const total = 150;

  for (let i = 0; i < total; i++) {
    const el = document.createElement('div');
    el.className = 'love_word';
    el.innerText = 'I miss you';

    // Heart shape formula
    const t = (i / total) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

    const scale = 12;
    const z = (Math.random() - 0.5) * 100;

    el.style.setProperty('--x', `${x * scale}px`);
    el.style.setProperty('--y', `${y * scale}px`);
    el.style.setProperty('--z', `${z}px`);
    el.style.animationDelay = `${Math.random() * 4}s`;

    container.appendChild(el);
  }
</script>
</body>
</html>
